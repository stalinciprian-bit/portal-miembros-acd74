<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Verificación de cartas · ACD74</title>
<style>
:root{--ink:#0f1b2a;--muted:#5b6675;--line:#d5dbe3;--bg:#f4f6f9;--panel:#fff;--brand:#0b3d6e;--ok:#0a7a3a;--okbg:#e7f5ec;--bad:#b42318;--badbg:#fdecea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e8edf3;--muted:#9aa6b4;--line:#2c3746;--bg:#0f151d;--panel:#16202b;--brand:#7fb0e6;--ok:#4cc27e;--okbg:#12301f;--bad:#ff7b6e;--badbg:#3a1714}}
:root[data-theme="dark"]{--ink:#e8edf3;--muted:#9aa6b4;--line:#2c3746;--bg:#0f151d;--panel:#16202b;--brand:#7fb0e6;--ok:#4cc27e;--okbg:#12301f;--bad:#ff7b6e;--badbg:#3a1714}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:28px 16px 40px}
header{display:flex;gap:14px;align-items:center;margin-bottom:20px}
header img{width:64px;height:64px}
header b{display:block;font-size:17px}
header span{color:var(--muted);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
.estado{display:flex;gap:12px;align-items:center;border-radius:8px;padding:14px 16px;margin-bottom:16px;font-weight:600}
.estado.ok{background:var(--okbg);color:var(--ok)}
.estado.bad{background:var(--badbg);color:var(--bad)}
.estado svg{flex:none}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
dt{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.03em;padding-top:2px}
dd{margin:0;font-weight:500;overflow-wrap:anywhere}
p.note{color:var(--muted);font-size:13px;margin:16px 0 0}
</style>
</head>
<body>
<main>
<header><img src="logo-acd74.png" alt="Logo del Aeroclub Dominicano 74"><div><b>Aeroclub Dominicano 74, Inc.</b><span>RNC 4-30-01006-5 · Verificación de cartas</span></div></header>
<div class="card" id="out"><p>Verificando…</p></div>
<p class="note">Esta página confirma que una carta emitida por el Aeroclub Dominicano 74, Inc. es auténtica y no fue alterada. Para cualquier consulta: aeroclubdominicano74@gmail.com</p>
</main>
<script>
const PUB={"kty": "EC", "crv": "P-256", "x": "ajDRXJLeWQ-53TXoto73fECzCdBNYKddN1Yr826rvHA", "y": "nhrEt6YIwekT9EsVyznteymfR09VQ08iUDlENSeXeXQ"};
const MES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fromB64u=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";const b=atob(s);return Uint8Array.from(b,c=>c.charCodeAt(0))};
const okIcon='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/></svg>';
const badIcon='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>';
function fecha(f){const[y,m,d]=String(f).split("-").map(Number);return d&&m?`${d} de ${MES[m-1]} de ${y}`:esc(f)}
function malo(msg){document.getElementById("out").innerHTML=`<div class="estado bad">${badIcon}<span>${msg}</span></div><p style="margin:0">No use esta carta como válida. Comuníquese con el Aeroclub para confirmarla.</p>`}
(async()=>{
  const h=location.hash.slice(1);
  if(!h){document.getElementById("out").innerHTML='<p style="margin:0">Escanee el código QR que aparece en la carta para verificarla.</p>';return}
  const[p,s]=h.split(".");
  if(!p||!s)return malo("El código de verificación está incompleto.");
  try{
    const key=await crypto.subtle.importKey("jwk",PUB,{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);
    const ok=await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},key,fromB64u(s),new TextEncoder().encode(p));
    if(!ok)return malo("Carta NO verificada: la firma no coincide o la carta fue alterada.");
    const d=JSON.parse(new TextDecoder().decode(fromB64u(p)));
    const filas=[["Carta No.",d.n],["Tipo",d.t+(d.mo?" · "+d.mo:"")],["Miembro",d.m],["No. de miembro",d.c],["Cédula / pasaporte",d.d],["Matrícula",d.mt],["Fecha de emisión",fecha(d.f)],["Firmada por","Presidente del Aeroclub Dominicano 74, Inc."]].filter(x=>x[1]);
    document.getElementById("out").innerHTML=`<div class="estado ok">${okIcon}<span>Carta auténtica, emitida y firmada por el Aeroclub Dominicano 74, Inc.</span></div><dl>${filas.map(([a,b])=>`<dt>${a}</dt><dd>${a==="Fecha de emisión"?b:esc(b)}</dd>`).join("")}</dl>`;
  }catch(e){malo("No se pudo verificar este código.")}
})();
</script>
</body>
</html>
